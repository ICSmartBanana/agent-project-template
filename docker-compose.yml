# Local development stack. Dev-only passwords come from .env (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent_owner
      POSTGRES_DB: agent
      POSTGRES_PASSWORD: ${AGENT_OWNER_PASSWORD:?set AGENT_OWNER_PASSWORD in .env}
      AGENT_APP_PASSWORD: ${AGENT_APP_PASSWORD:?set AGENT_APP_PASSWORD in .env}
      AGENT_INGEST_PASSWORD: ${AGENT_INGEST_PASSWORD:?set AGENT_INGEST_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AGENT_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first-start init Postgres listens on the unix socket only, so this
      # stays unhealthy until db/init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agent_owner -d agent"]
      interval: 5s
      retries: 10
    mem_limit: 512m

  api:
    build: .
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      AGENT_APP_PASSWORD: ${AGENT_APP_PASSWORD}
      AGENT_DB_HOST: db
      AGENT_DB_PORT: "5432"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      AGENT_ENV: docker
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  ui:
    build: .
    command: ["streamlit", "run", "app/ui/streamlit_app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      AGENT_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    mem_limit: 512m

volumes:
  pgdata:
